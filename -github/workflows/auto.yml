name: 每日自动更新足球赛事数据



on:

  schedule:

    - cron: '0 18 * * *'   # 北京时间 02:00

    - cron: '0 4 * * *'    # 北京时间 12:00

    - cron: '0 11 * * *'   # 北京时间 19:00

  workflow_dispatch:        # 支持在 Actions 页面手动触发



permissions:

  contents: write



jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: 拉取仓库代码

        uses: actions/checkout@v4



      - name: 安装 Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'



      - name: 运行数据抓取与分析脚本

        env:

          FD_API_KEY: ${{ secrets.FD_API_KEY }}

        run: python main.py



      - name: 提交并推送更新后的数据

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule.json match_analysis.json predictions_history.json

          git diff --cached --quiet || (git commit -m "自动更新赛事数据" && git push)
